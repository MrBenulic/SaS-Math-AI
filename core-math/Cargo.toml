[package]
name = "sas-math-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic exact + Monte Carlo slot math engine (M1)"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_chacha = "0.3"
rand_core = "0.6"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
