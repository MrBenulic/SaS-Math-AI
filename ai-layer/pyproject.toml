[project]
name = "sas-math-ai-layer"
version = "0.4.0"
description = "SaS-Math AI — AI Context Translator + orchestration (M3)"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "httpx",  # Groq LLM adapter (translator.py) + test client
    "openpyxl",  # Excel math-sheet exporter (mathsheet.py)
]

[project.optional-dependencies]
dev = ["pytest", "jsonschema"]  # jsonschema: ADR-004 schema-conformance tests

[tool.pytest.ini_options]
testpaths = ["tests"]
